server.port=8081

# PostgreSQL: use the database you created in pgAdmin and YOUR own password.
spring.datasource.url=jdbc:postgresql://localhost:5432/Edu_Market
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
# The tables already exist (schema.sql), so Spring must not change them.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
