spring.application.name=edumarket

server.port=8080

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/edumarket}
spring.datasource.username=postgres
spring.datasource.password=${Password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Google Gemini AI Configuration (Free Tier via Google AI Studio)
# Google Gemini AI Configuration (Free Tier via Google AI Studio)
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.8-flash
spring.ai.google.genai.chat.temperature=0.7
spring.ai.google.genai.chat.max-output-tokens=1024

